name: inputs-demo
on: 
  # push:
  workflow_dispatch:  #manual trigger
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: print inputs
        run: |
          echo "${{ inputs.logLevel }}"
          echo "${{ inputs.tags }}"